<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示的网站</title>
    <style>
        .colortit{
            font-size: 70px;
            font-weight: 500;
            font-size: 70px;
            font-weight: bold;   
            background: linear-gradient(90deg, 
            red, orange, yellow, green, blue, indigo, violet, red
        );
      
        background-size: 800% 800%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: colorMove 5s linear infinite;
        }

        @keyframes colorMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        
        .btn{
            padding: 10px 10px;
            border: none;
            border-radius: 4px;
            background:#006779;
            color: white;
            transition: all 0.2s;
            vertical-align: middle;
            margin-left: 6px;
        }
        .btn:active{
            transform: scale(0.9);
            background: #004b58;
        }
    </style>
    <style>
        .foxt{
            font-size: 20px;
            color: white;
            text-indent: 60px;
        }

        .center-row {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body style="background-color: #5a5656;">
    <div class="center-row">
        <p class="colortit">welcome to my website!</p>
        <button class="btn"><img src="showing.jpg" alt="showing"></button>
    </div>
    <p class="foxt">是的没错，这是我的网站，个人历史上的创举！</p>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示的网站</title>
    <style>
        .colortit{
            font-size: 70px;
            font-weight: 500;
            font-size: 70px;
            font-weight: bold;   
            background: linear-gradient(90deg, 
            red, orange, yellow, green, blue, indigo, violet, red
        );
      
        background-size: 800% 800%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: colorMove 5s linear infinite;
        }

        @keyframes colorMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        
        .btn{
            padding: 10px 10px;
            border: none;
            border-radius: 4px;
            background:#006779;
            color: white;
            transition: all 0.2s;
            vertical-align: middle;
            margin-left: 6px;
        }
        .btn:active{
            transform: scale(0.9);
            background: #004b58;
        }
    </style>
    <style>
        .foxt{
            font-size: 20px;
            color: white;
            text-indent: 60px;
        }
        .titxt{
            font-size: 30px;
            color: rgb(51, 51, 51);
        }
        .center-row {
            text-align: center;
            margin: 20px 0;
        }
    </style>
    <style>
        .vidcs {
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 1000px;
        }
    </style>
</head>
<body style="background-color: #5a5656;">
    <div class="center-row">
        <p class="colortit">welcome to my website!</p>
        <button class="btn"><img src="showing.jpg" alt="showing"></button>
    </div>
    <p class="foxt">是的没错，这是我的网站，个人历史上的创举！</p>
    <div class="center-row">
        <p class="foxt">关于，我的作品？</p>
        <p class="titxt">我的第一个网站的建立！</p>
        <video src="我的第一网站.mp4" controls autoplay loop class="vidcs"></video>
        <p class="titxt">Scratch那些有用没用的小技巧2.0</p>
        <video src="Scratch那些有用没用的小技巧2.0.mp4" controls autoplay loop class="vidcs"></video>
        <a href="https://space.bilibili.com/1443283189/upload/video" target="_blank">更多我的B站作品...</a>
    </div>
    <script>
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo({top: 0, left: 0, behavior: 'instant'});
        document.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
        });
        window.addEventListener('load', () => {
            setTimeout(()=>window.scrollTo(0,0),10);
        });
        // 监听滚动事件，保持页面在顶部
</script>
</body>
</html>
